<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>พิมพ์บิล POS</title>
  <style>
    @font-face{font-family:ReceiptThai;src:url('/assets/fonts/THSarabun.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:ReceiptThai;src:url('/assets/fonts/THSarabun-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.page{max-width:520px;margin:0 auto;padding:16px}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:10px;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:0 12px 30px rgba(15,23,42,.08)}.toolbar strong{font-size:18px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;min-height:42px;padding:0 16px;font-weight:800;cursor:pointer}.btn-primary{background:#159447;color:#fff}.btn-light{background:#eef3f0;color:#111827}.receipt{width:80mm;max-width:100%;margin:0 auto;background:#fff;border-radius:14px;padding:12px;font-family:ReceiptThai,'TH Sarabun New',Sarabun,sans-serif;font-size:20px;line-height:1.08;box-shadow:0 16px 50px rgba(15,23,42,.12)}.center{text-align:center}.shop{font-size:28px;font-weight:700;line-height:1}.receipt-title{font-size:22px;font-weight:700;margin-top:3px}.muted{color:#64748b;font-size:18px}.rule{border:0;border-top:1px dashed #cbd5e1;margin:8px 0}.row{display:flex;justify-content:space-between;gap:10px;margin:3px 0}.row span:last-child,.row strong:last-child{text-align:right}.item{display:grid;grid-template-columns:1fr auto;gap:8px;margin:5px 0}.item strong{font-weight:700}.item small{display:block;color:#64748b;font-size:18px}.total{font-size:24px;font-weight:700}.loading,.missing{background:#fff;border-radius:16px;padding:24px;text-align:center;color:#64748b}.footer{white-space:pre-line}.logo{display:block;max-width:54px;max-height:54px;object-fit:contain;margin:0 auto 4px}@media print{body{background:#fff}.page{padding:0;margin:0}.toolbar{display:none!important}.receipt{box-shadow:none;border-radius:0;width:80mm;max-width:none;margin:0;padding:0}.loading,.missing{display:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <strong>พิมพ์บิล</strong>
      <div class="actions"><button id="printBtn" class="btn btn-primary" type="button">พิมพ์บิล</button><button id="closeBtn" class="btn btn-light" type="button">ปิด</button></div>
    </div>
    <div id="receiptRoot" class="loading">กำลังโหลดบิล...</div>
  </main>
  <script type="module" src="/assets/js/retail-pos-receipt-window.js?v=20260706-045"></script>
</body>
</html>
