<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ใบกำกับภาษี</title>
  <link rel="stylesheet" href="/assets/css/retail-pos-font-local.css?v=20260707-018">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eef2f7;color:#111827;font-family:var(--app-ui-font,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif)}
    .page{max-width:920px;margin:0 auto;padding:18px}
    .toolbar{position:sticky;top:0;z-index:3;display:flex;gap:10px;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:0 12px 30px rgba(15,23,42,.08);font-family:var(--app-ui-font,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif)}
    .toolbar strong{font-size:18px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;min-height:42px;padding:0 16px;font-weight:500;cursor:pointer;text-decoration:none;font-family:var(--app-ui-font,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif)}
    .btn i{font-size:1rem;line-height:1}
    .btn-primary{background:#159447;color:#fff}
    .btn-light{background:#eef3f0;color:#111827}
    .tax-stack{display:flex;flex-direction:column;gap:14px}
    .tax-paper{position:relative;width:210mm;height:297mm;min-height:297mm;max-height:297mm;max-width:100%;margin:0 auto;background:#fff;border-radius:12px;padding:12mm 14mm;font-family:var(--paper-font-local,'TH Sarabun New',Sarabun,sans-serif);font-size:20px;line-height:1.08;box-shadow:0 16px 50px rgba(15,23,42,.12);break-after:page;page-break-after:always;display:flex;flex-direction:column;overflow:hidden}
    .tax-paper:last-child{break-after:auto;page-break-after:auto}
    .void-stamp{position:absolute;top:86mm;left:50%;transform:translateX(-50%) rotate(-16deg);z-index:1;border:5px double #be123c;color:#be123c;border-radius:10px;padding:8px 28px;font-family:var(--app-ui-font,system-ui,sans-serif);font-size:54px;font-weight:500;opacity:.2;pointer-events:none}
    .void-note{margin:7px 0;padding:6px 8px;border:1px solid #fecdd3;border-radius:8px;background:#fff1f2;color:#9f1239;font-family:var(--app-ui-font,system-ui,sans-serif);font-size:15px;line-height:1.25}
    .tax-title{text-align:center;border-bottom:2px solid #111827;padding-bottom:6px;margin-bottom:9px;flex:0 0 auto}
    .tax-title h1{margin:0;font-size:30px;line-height:1}
    .tax-title div{font-size:18px;color:#64748b}
    .tax-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(58mm,.85fr);gap:12px;align-items:start;flex:0 0 auto}
    .top-grid h2,.buyer-box h2{margin:0 0 3px;font-size:23px;line-height:1.08}
    .top-grid p,.buyer-box p{margin:1px 0}
    .doc-box{border:1px solid #111827;border-radius:7px;padding:7px 9px;display:grid;gap:3px;align-self:start;font-size:18px;line-height:1.05}
    .doc-box div{display:grid;grid-template-columns:58px minmax(0,1fr);column-gap:8px;align-items:start}
    .doc-box span{white-space:nowrap}
    .doc-box strong{display:block;text-align:left;overflow-wrap:anywhere;word-break:break-word;line-height:1.05}
    .buyer-box{margin:8px 0 9px;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;flex:0 0 auto}
    .items-table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:0;font-size:18px;line-height:1.05;break-inside:avoid;page-break-inside:avoid;flex:0 0 auto}
    .items-table th,.items-table td{border:1px solid #cbd5e1;padding:3px 5px;vertical-align:top}
    .items-table th{background:#f1f5f9}
    .items-table th:nth-child(1),.items-table td:nth-child(1){width:7%;text-align:center}
    .items-table th:nth-child(2),.items-table td:nth-child(2){width:55%}
    .items-table th:nth-child(3),.items-table td:nth-child(3){width:12%}
    .items-table th:nth-child(4),.items-table td:nth-child(4),.items-table th:nth-child(5),.items-table td:nth-child(5){width:13%}
    .right{text-align:right}
    .tax-final-block{margin-top:auto;break-inside:avoid;page-break-inside:avoid;flex:0 0 auto}
    .summary-box{width:min(360px,100%);margin:8px 0 0 auto;font-size:18px}
    .summary-box div{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px solid #e5e7eb}
    .summary-box .grand{font-size:22px;font-weight:700;border-top:2px solid #111827;border-bottom:0;margin-top:3px}
    .signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:16px;text-align:center;font-size:18px}
    .signature-grid span{display:block;height:30px;border-bottom:1px solid #111827}
    .signature-grid p{margin:4px 0 0}
    .loading,.missing{background:#fff;border-radius:16px;padding:24px;text-align:center;color:#64748b}
    @media print{
      @page{size:A4;margin:0}
      body{background:#fff}
      .page{padding:0;margin:0;max-width:none}
      .toolbar{display:none!important}
      .tax-stack{display:block;gap:0}
      .tax-paper{box-shadow:none;border-radius:0;width:210mm;height:297mm;min-height:297mm;max-height:297mm;max-width:none;margin:0;padding:12mm 14mm;break-after:page;page-break-after:always;overflow:hidden}
      .tax-paper:last-child{break-after:auto;page-break-after:auto}
      .loading,.missing{display:none!important}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <strong>ใบกำกับภาษี</strong>
      <div class="actions"><a class="btn btn-light" href="/pos/tax-invoices/"><i class="bi bi-clock-history" aria-hidden="true"></i><span>ประวัติ</span></a><button id="printBtn" class="btn btn-primary" type="button"><i class="bi bi-printer" aria-hidden="true"></i><span>พิมพ์</span></button><button id="closeBtn" class="btn btn-light" type="button"><i class="bi bi-x-lg" aria-hidden="true"></i><span>ปิด</span></button></div>
    </div>
    <div id="taxInvoiceRoot" class="loading">กำลังโหลดใบกำกับภาษี...</div>
  </main>
  <script type="module" src="/assets/js/retail-pos-tax-invoice-window.js?v=20260716-007"></script>
</body>
</html>
