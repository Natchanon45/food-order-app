<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#159447">
  <title>ใบกำกับภาษี</title>
  <link rel="stylesheet" href="/assets/css/icons.css?v=20260903-240">
  <link rel="stylesheet" href="/assets/css/i18n.css?v=20260903-240">
  <link rel="stylesheet" href="/assets/css/pos-locale-switcher-placement.css?v=20260903-251">
  <link rel="stylesheet" href="/assets/css/retail-pos-font-local.css?v=20260707-018">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eef2f7;color:#111827;font-family:var(--app-ui-font,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif)}
    .page{max-width:920px;margin:0 auto;padding:18px}
    .toolbar{position:sticky;top:0;z-index:3;display:flex;gap:10px;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:0 12px 30px rgba(15,23,42,.08);font-family:var(--app-ui-font,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif)}
    .toolbar strong{font-size:18px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;min-height:42px;padding:0 16px;font-weight:500;cursor:pointer;text-decoration:none;font-family:var(--app-ui-font,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif)}
    .btn-icon{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    .btn-primary{background:#159447;color:#fff}
    .btn-light{background:#eef3f0;color:#111827}
    .tax-stack{display:flex;flex-direction:column;gap:14px}
    .tax-paper{position:relative;width:210mm;height:297mm;min-height:297mm;max-height:297mm;max-width:100%;margin:0 auto;background:#fff;border-radius:12px;padding:10mm 12mm;font-family:var(--paper-font-local,'TH Sarabun New',Sarabun,sans-serif);font-size:18px;line-height:1.03;box-shadow:0 16px 50px rgba(15,23,42,.12);break-after:page;page-break-after:always;display:flex;flex-direction:column;overflow:hidden}
    .tax-paper:last-child{break-after:auto;page-break-after:auto}
    .void-stamp{position:absolute;top:86mm;left:50%;transform:translateX(-50%) rotate(-16deg);z-index:1;border:5px double #be123c;color:#be123c;border-radius:10px;padding:8px 28px;font-family:var(--app-ui-font,system-ui,sans-serif);font-size:54px;font-weight:500;opacity:.2;pointer-events:none}
    .void-note{margin:7px 0;padding:6px 8px;border:1px solid #fecdd3;border-radius:8px;background:#fff1f2;color:#9f1239;font-family:var(--app-ui-font,system-ui,sans-serif);font-size:15px;line-height:1.25}
    .tax-title{text-align:center;border-bottom:2px solid #111827;padding-bottom:4px;margin-bottom:6px;flex:0 0 auto}
    .tax-title h1{margin:0;font-size:26px;line-height:1}
    .tax-title div{font-size:16px;color:#64748b}
    .tax-page-number{position:absolute;top:10mm;right:12mm;font-size:16px;color:#334155}
    .tax-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(56mm,.85fr);gap:9px;align-items:start;flex:0 0 auto}
    .top-grid h2,.buyer-box h2{margin:0 0 2px;font-size:21px;line-height:1.04}
    .top-grid p,.buyer-box p{margin:1px 0}
    .doc-box{border:1px solid #111827;border-radius:7px;padding:6px 8px;display:grid;gap:2px;align-self:start;font-size:17px;line-height:1.03}
    .doc-box div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,58%);column-gap:8px;align-items:start;min-width:0}
    .doc-box span,.doc-box strong{min-width:0;overflow-wrap:anywhere;word-break:break-word;line-height:1.12}
    .doc-box strong{display:block;text-align:left}
    .buyer-box{margin:6px 0 7px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;flex:0 0 auto}
    .items-table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:0;font-size:16px;line-height:1.01;break-inside:avoid;page-break-inside:avoid;flex:0 0 auto}
    .items-table th,.items-table td{border:1px solid #cbd5e1;padding:2px 4px;vertical-align:top}
    .items-table th{background:#f1f5f9}
    .items-table th:nth-child(1),.items-table td:nth-child(1){width:7%;text-align:center}
    .items-table th:nth-child(2),.items-table td:nth-child(2){width:55%}
    .items-table th:nth-child(3),.items-table td:nth-child(3){width:12%}
    .items-table th:nth-child(4),.items-table td:nth-child(4),.items-table th:nth-child(5),.items-table td:nth-child(5){width:13%}
    .right{text-align:right}
    .tax-final-block{margin-top:auto;break-inside:avoid;page-break-inside:avoid;flex:0 0 auto}
    .summary-box{width:min(340px,100%);margin:6px 0 0 auto;font-size:16px}
    .summary-box div{display:flex;justify-content:space-between;gap:12px;padding:1px 0;border-bottom:1px solid #e5e7eb}
    .summary-box .grand{font-size:20px;font-weight:700;border-top:2px solid #111827;border-bottom:0;margin-top:2px}
    .signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:12px;text-align:center;font-size:16px}
    .signature-grid span{display:block;height:24px;border-bottom:1px solid #111827}
    .signature-grid p{margin:3px 0 0}
    .loading,.missing{background:#fff;border-radius:16px;padding:24px;text-align:center;color:#64748b}
    @media print{
      @page{size:A4;margin:0}
      body{background:#fff}
      .page{padding:0;margin:0;max-width:none}
      .toolbar{display:none!important}
      .tax-stack{display:block;gap:0}
      .tax-paper{box-shadow:none;border-radius:0;width:210mm;height:297mm;min-height:297mm;max-height:297mm;max-width:none;margin:0;padding:10mm 12mm;break-after:page;page-break-after:always;overflow:hidden}
      .tax-paper:last-child{break-after:auto;page-break-after:auto}
      .loading,.missing{display:none!important}
    }
  </style>
</head>
<body>

    <div class="toolbar">
      <strong>ใบกำกับภาษี</strong>
      <div class="actions"><a class="btn btn-light" href="/pos/tax-invoices/"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg><span>ประวัติ</span></a><button id="printBtn" class="btn btn-primary" type="button"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg><span>พิมพ์</span></button><button id="closeBtn" class="btn btn-light" type="button"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span>ปิด</span></button></div>
    </div>
    <div id="taxInvoiceRoot" class="loading">กำลังโหลดใบกำกับภาษี...</div>
