<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ใบกำกับภาษีเต็มรูปแบบ</title>
  <style>
    @font-face{font-family:ReceiptThai;src:url('/assets/fonts/THSarabun.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:ReceiptThai;src:url('/assets/fonts/THSarabun-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.page{max-width:920px;margin:0 auto;padding:18px}.toolbar{position:sticky;top:0;z-index:3;display:flex;gap:10px;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:0 12px 30px rgba(15,23,42,.08)}.toolbar strong{font-size:18px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;min-height:42px;padding:0 16px;font-weight:800;cursor:pointer}.btn-primary{background:#159447;color:#fff}.btn-light{background:#eef3f0;color:#111827}.tax-paper{width:210mm;min-height:297mm;max-width:100%;margin:0 auto;background:#fff;border-radius:12px;padding:18mm;font-family:ReceiptThai,'TH Sarabun New',Sarabun,sans-serif;font-size:22px;line-height:1.12;box-shadow:0 16px 50px rgba(15,23,42,.12)}.tax-title{text-align:center;border-bottom:2px solid #111827;padding-bottom:8px;margin-bottom:12px}.tax-title h1{margin:0;font-size:34px;line-height:1}.tax-title div{font-size:22px;color:#64748b}.tax-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.top-grid h2,.buyer-box h2{margin:0 0 4px;font-size:26px}.top-grid p,.buyer-box p{margin:2px 0}.doc-box{border:1px solid #111827;border-radius:8px;padding:10px}.doc-box div,.summary-box div{display:flex;justify-content:space-between;gap:12px}.buyer-box{margin:14px 0;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.items-table{width:100%;border-collapse:collapse;margin-top:12px}.items-table th,.items-table td{border:1px solid #cbd5e1;padding:6px 8px;vertical-align:top}.items-table th{background:#f1f5f9}.right{text-align:right}.summary-box{width:min(390px,100%);margin:14px 0 0 auto}.summary-box div{padding:4px 0;border-bottom:1px solid #e5e7eb}.summary-box .grand{font-size:28px;font-weight:700;border-top:2px solid #111827;border-bottom:0;margin-top:4px}.signature-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:38px;text-align:center}.signature-grid span{display:block;height:52px;border-bottom:1px solid #111827}.signature-grid p{margin:6px 0 0}.loading,.missing{background:#fff;border-radius:16px;padding:24px;text-align:center;color:#64748b}@media print{body{background:#fff}.page{padding:0;margin:0;max-width:none}.toolbar{display:none!important}.tax-paper{box-shadow:none;border-radius:0;width:210mm;min-height:297mm;max-width:none;margin:0;padding:14mm}.loading,.missing{display:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <strong>ใบกำกับภาษีเต็มรูปแบบ</strong>
      <div class="actions"><button id="printBtn" class="btn btn-primary" type="button">พิมพ์</button><button id="closeBtn" class="btn btn-light" type="button">ปิด</button></div>
    </div>
    <div id="taxInvoiceRoot" class="loading">กำลังโหลดใบกำกับภาษี...</div>
  </main>
  <script type="module" src="/assets/js/retail-pos-tax-invoice-window.js?v=20260706-075"></script>
</body>
</html>
