<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#159447" />
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="/assets/css/retail-pos.css?v=20260707-018" />
    <link
      rel="stylesheet"
      href="/assets/css/retail-pos-login.css?v=20260627-3"
    />
    <link rel="stylesheet" href="/assets/css/icons.css?v=20260702-003" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          "Kanit",
          "Sarabun",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #151515;
      }
      body.login-page {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: linear-gradient(145deg, #eef8f1, #f8fbf9);
      }
      .login-shell {
        width: min(430px, 100%);
        display: grid;
        gap: 13px;
        justify-items: center;
      }
      .login-home-link {
        width: max-content;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid #cfe8d8;
        border-radius: 999px;
        padding: 7px 12px;
        background: #edf8f1;
        color: #0d6f34;
        font-weight: 800;
        font-size: 12px;
        text-decoration: none;
        box-shadow: none;
      }
      .login-home-link:hover {
        background: #e4f4ea;
        color: #0b6530;
      }
      .login-home-link .app-icon {
        width: 16px;
        height: 16px;
        color: currentColor;
      }
      .login-card {
        width: 100%;
        padding: 28px;
        border: 1px solid #dbe5df;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 55px rgba(15, 23, 42, 0.12);
      }
      .login-brand {
        text-align: center;
        margin-bottom: 24px;
      }
      .login-brand .login-logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 12px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #159447;
        color: #fff;
        font-size: 1.35rem;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .login-brand h1 {
        margin: 0;
        font-size: 1.45rem;
        line-height: 1.25;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
      }
      .login-brand h1 .app-icon {
        width: 1.05em;
        height: 1.05em;
        color: #159447;
      }
      .login-brand p {
        margin: 7px 0 0;
        color: #64748b;
      }
      .login-form {
        display: grid;
        gap: 14px;
      }
      .login-form label {
        display: grid;
        gap: 7px;
        font-weight: 700;
      }
      .login-field-title {
        font-weight: 800;
      }
      .login-input-wrap {
        position: relative;
      }
      .login-input-wrap .login-field-icon {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%) scale(1);
        width: 18px;
        height: 18px;
        color: #159447;
        opacity: 1;
        pointer-events: none;
        transition:
          top 0.2s ease,
          transform 0.2s ease,
          color 0.2s ease,
          opacity 0.2s ease;
      }
      .login-input-wrap:focus-within .login-field-icon,
      .login-input-wrap.is-filled .login-field-icon {
        top: 7px;
        transform: translateY(0) scale(0.72);
        color: #159447;
        opacity: 1;
      }
      .login-form input {
        width: 100%;
        height: 52px;
        min-height: 52px;
        border: 1px solid #dde5df;
        border-radius: 12px;
        padding: 14px 12px 14px 42px;
        background: #fff;
        font: inherit;
        line-height: 20px;
        transition:
          border-color 0.18s ease,
          outline-color 0.18s ease,
          background-color 0.18s ease,
          padding 0.18s ease;
      }
      .login-form input:focus {
        outline: 3px solid #15944722;
        border-color: #159447;
      }
      .login-input-wrap:focus-within input,
      .login-input-wrap.is-filled input {
        padding-top: 17px;
        padding-bottom: 11px;
      }
      .login-password-wrap input {
        padding-right: 72px;
      }
      .login-password-wrap:focus-within input,
      .login-password-wrap.is-filled input {
        padding-right: 72px;
      }
      .login-password-wrap button {
        position: absolute;
        right: 7px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        color: #159447;
        font-weight: 800;
        padding: 7px;
        font: inherit;
        line-height: 1;
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        font: inherit;
        cursor: pointer;
      }
      .btn-pay {
        background: #159447;
        color: #fff;
      }
      .login-submit {
        min-height: 48px;
        margin-top: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .login-submit .app-icon {
        width: 18px;
        height: 18px;
      }
      .login-error {
        min-height: 22px;
        margin: 0;
        color: #b42318;
        font-weight: 700;
      }
      .login-loading {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .login-loading::before {
        content: "";
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-top-color: #fff;
        border-radius: 50%;
        animation: login-spin 0.8s linear infinite;
      }
      .login-page .app-version {
        font-size: 12px;
        line-height: 1.35;
        font-weight: 500;
        color: #7b8b82;
        padding: 8px 12px 16px;
      }
      @keyframes login-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 520px) {
        body.login-page {
          padding: 12px;
        }
        .login-shell {
          gap: 11px;
        }
        .login-card {
          padding: 20px;
          border-radius: 16px;
        }
        .login-home-link {
          font-size: 12px;
          padding: 7px 11px;
        }
        .login-brand .login-logo {
          width: 60px;
          height: 60px;
        }
        .login-brand h1 {
          font-size: 1.38rem;
        }
        .login-form input {
          height: 52px;
          min-height: 52px;
          line-height: 20px;
        }
        .login-page .app-version {
          font-size: 12px;
          padding-bottom: 12px;
        }
      }
    </style>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <div class="login-brand">
          <div class="login-logo">FOD</div>
          <h1>
            <i class="bi bi-person-circle app-icon" aria-hidden="true"></i
            ><span>เข้าสู่ระบบพนักงาน</span>
          </h1>
          <p>Order • Delivery • Retail POS</p>
        </div>
        <form
          id="loginForm"
          class="login-form"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >
          <label
            ><span class="login-field-title">อีเมล</span
            ><span class="login-input-wrap"
              ><i
                class="bi bi-envelope app-icon login-field-icon"
                aria-hidden="true"
              ></i
              ><input
                id="email"
                name="fod-login-email"
                type="email"
                autocomplete="off"
                maxlength="100"
                required
                autofocus /></span
          ></label>
          <label
            ><span class="login-field-title">รหัสผ่าน</span
            ><span class="login-input-wrap login-password-wrap"
              ><i
                class="bi bi-key app-icon login-field-icon"
                aria-hidden="true"
              ></i
              ><input
                id="password"
                name="fod-login-secret"
                type="password"
                autocomplete="new-password"
                maxlength="100"
                required
                minlength="6"
              /><button id="togglePasswordBtn" type="button">แสดง</button></span
            ></label
          >
          <p id="loginError" class="login-error" hidden></p>
          <button
            id="loginButton"
            class="btn btn-pay login-submit"
            type="submit"
          >
            <i class="bi bi-box-arrow-in-right app-icon" aria-hidden="true"></i
            ><span>เข้าสู่ระบบ</span>
          </button>
        </form>
      </section>
      <a class="login-home-link" href="/"
        ><i class="bi bi-house-door app-icon" aria-hidden="true"></i
        ><span>หน้าหลัก</span></a
      >
    </main>
    <script type="module" src="/assets/js/login.js?v=20260704-003"></script>
    <script>
      window.addEventListener("error", function () {
        var e = document.getElementById("loginError"),
          b = document.getElementById("loginButton");
        if (e) {
          e.hidden = false;
          e.textContent = "โหลดระบบเข้าสู่ระบบไม่สำเร็จ กรุณารีเฟรชหน้า";
        }
        if (b) {
          b.disabled = false;
          b.innerHTML =
            '<i class="bi bi-box-arrow-in-right app-icon" aria-hidden="true"></i><span>เข้าสู่ระบบ</span>';
        }
      });
      window.addEventListener("unhandledrejection", function () {
        var e = document.getElementById("loginError"),
          b = document.getElementById("loginButton");
        if (e) {
          e.hidden = false;
          e.textContent = "ระบบเข้าสู่ระบบเกิดข้อผิดพลาด กรุณาลองใหม่";
        }
        if (b) {
          b.disabled = false;
          b.innerHTML =
            '<i class="bi bi-box-arrow-in-right app-icon" aria-hidden="true"></i><span>เข้าสู่ระบบ</span>';
        }
      });
    </script>
  </body>
</html>
