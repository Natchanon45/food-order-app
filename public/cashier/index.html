  <style>.app-header:has(#deliveryAlertButton) > .user-menu { margin-left:0!important; }</style>
  <title>หน้าแคชเชียร์</title>
  <script>
    if (location.pathname.replace(/\/$/, "") === "/cashier/waiting-queue") {
      const target = new URL("/waiting-queue/", location.origin);
      for (const [key, value] of new URLSearchParams(location.search)) target.searchParams.set(key, value);
      target.hash = location.hash;
      location.replace(target.href);
    }
  </script>
</head>
<body class="order-delivery-workspace cashier-page" data-roles="owner,admin,cashier">
  <div id="demoBanner"></div>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">FO</span><span data-i18n="cashier.header.title">หน้าแคชเชียร์</span></div>
    <div class="app-locale-switcher" data-static-locale-switcher><details class="app-locale-menu" data-locale-menu><summary class="app-locale-trigger" aria-label="Language" title="Language"><i class="bi bi-globe2" aria-hidden="true"></i><span class="visually-hidden">Language</span></summary><div class="app-locale-menu__panel" role="menu" aria-label="Language"><button type="button" class="app-locale-option" data-locale-option="th" lang="th" role="menuitemradio" aria-checked="true"><span>ไทย</span><i class="bi bi-check-lg" aria-hidden="true"></i></button><button type="button" class="app-locale-option" data-locale-option="en" lang="en" role="menuitemradio" aria-checked="false"><span>English</span><i class="bi bi-check-lg" aria-hidden="true"></i></button></div></details></div>
  </header>
  <main class="container cashier-shell">
    <section class="hero cashier-hero"><div class="cashier-hero-copy"><h1 data-i18n="cashier.hero.title">หน้าแคชเชียร์</h1><p data-i18n="cashier.hero.description">ตรวจสอบรายการ รับชำระเงิน และปิดบิลจากหน้าจอเดียว</p></div></section>
    <section class="cashier-action-bar" aria-label="เครื่องมือสั่งกลับบ้าน" data-i18n-aria-label="cashier.takeaway_tools.aria_label">
      <div class="cashier-action-title"><strong data-i18n="cashier.takeaway_tools.title">เครื่องมือสั่งกลับบ้าน</strong><span data-i18n="cashier.takeaway_tools.subtitle">สำหรับลูกค้า Walk-in</span></div>
      <div class="cashier-actions">
        <a class="btn btn-primary" href="/cashier/waiting-queue" aria-label="จัดการคิวรอโต๊ะ" title="จัดการคิวรอโต๊ะ" data-i18n-aria-label="cashier.takeaway_tools.waiting_queue_aria" data-i18n-title="cashier.takeaway_tools.waiting_queue_aria"><i class="bi bi-person-standing app-icon" aria-hidden="true"></i><span data-i18n="cashier.takeaway_tools.waiting_queue">คิวรอโต๊ะ</span></a>
        <button class="btn btn-primary" type="button" id="showTakeawayQr" aria-label="แสดง QR สั่งกลับบ้าน" title="แสดง QR สั่งกลับบ้าน" data-i18n-aria-label="cashier.takeaway_tools.show_qr_aria" data-i18n-title="cashier.takeaway_tools.show_qr_aria"><i class="bi bi-qr-code app-icon" aria-hidden="true"></i><span data-i18n="cashier.takeaway_tools.qr_label">QR Take Away</span></button>
        <a class="btn btn-warning" id="openTakeawayOrder" target="_blank" rel="noopener" aria-label="เปิดหน้าสั่งกลับบ้าน" title="เปิดหน้าสั่งกลับบ้าน" data-i18n-aria-label="cashier.takeaway_tools.open_order_aria" data-i18n-title="cashier.takeaway_tools.open_order_aria"><i class="bi bi-plus-lg app-icon" aria-hidden="true"></i><span data-i18n="cashier.takeaway_tools.open_order">สั่งกลับบ้าน</span></a>
        <button class="btn cashier-copy-action" type="button" id="copyTakeawayUrl" aria-label="คัดลอกลิงก์สั่งกลับบ้าน" title="คัดลอกลิงก์สั่งกลับบ้าน" data-i18n-aria-label="cashier.takeaway_tools.copy_link_aria" data-i18n-title="cashier.takeaway_tools.copy_link_aria"><i class="bi bi-clipboard app-icon" aria-hidden="true"></i><span data-i18n="cashier.takeaway_tools.copy_link">คัดลอกลิงก์</span></button>
      </div>
    </section>
    <section class="cashier-workspace" aria-labelledby="cashierQueueTitle">
      <header class="cashier-section-head"><div><h2 id="cashierQueueTitle" data-i18n="cashier.queue.title">บิลที่รอดำเนินการ</h2><p data-i18n="cashier.queue.description">รายการใหม่จะแสดงที่หน้านี้โดยอัตโนมัติ</p></div><span id="cashierOrderCount" class="cashier-order-count">0 บิล</span></header>
      <div id="orderGrid" class="cashier-order-grid"></div>
    </section>
  </main>

</body>
