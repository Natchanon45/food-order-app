<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#159447" />
    <link rel="stylesheet" href="/assets/css/app.css?v=20260731-079" />
    <link rel="stylesheet" href="/assets/css/icons.css?v=20260731-079" />
    <link rel="stylesheet" href="/assets/css/sweet-dialog.css?v=20260731-079" />
    <link rel="stylesheet" href="/assets/css/sweet-dialog-polish.css?v=20260731-089" />
    <link rel="stylesheet" href="/assets/css/cashier-refresh.css?v=20260731-079" />
    <link rel="stylesheet" href="/assets/css/order-delivery-workspace-theme.css?v=20260731-079" />
    <title>หน้าแคชเชียร์</title>
  </head>
  <body class="order-delivery-workspace cashier-page" data-roles="cashier">
    <div id="demoBanner"></div>
    <header class="app-header">
      <div class="brand"><span class="brand-mark">FO</span>หน้าแคชเชียร์</div>
    </header>
    <main class="container cashier-shell">
      <section class="hero cashier-hero">
        <div class="cashier-hero-copy">
          <h1>หน้าแคชเชียร์</h1>
          <p>ตรวจสอบรายการ รับชำระเงิน และปิดบิลจากหน้าจอเดียว</p>
        </div>
      </section>
      <section class="cashier-action-bar" aria-label="เครื่องมือสั่งกลับบ้าน">
        <div class="cashier-action-title">
          <strong>เครื่องมือสั่งกลับบ้าน</strong>
          <span>สำหรับลูกค้า Walk-in</span>
        </div>
        <div class="cashier-actions">
          <button class="btn btn-primary" type="button" id="showTakeawayQr" aria-label="แสดง QR สั่งกลับบ้าน" title="แสดง QR สั่งกลับบ้าน">
            <i class="bi bi-qr-code app-icon" aria-hidden="true"></i>
            <span>QR Take Away</span>
          </button>
          <a class="btn btn-warning" id="openTakeawayOrder" target="_blank" rel="noopener" aria-label="เปิดหน้าสั่งกลับบ้าน" title="เปิดหน้าสั่งกลับบ้าน">
            <i class="bi bi-plus-lg app-icon" aria-hidden="true"></i>
            <span>สั่งกลับบ้าน</span>
          </a>
          <button class="btn cashier-copy-action" type="button" id="copyTakeawayUrl" aria-label="คัดลอกลิงก์สั่งกลับบ้าน" title="คัดลอกลิงก์สั่งกลับบ้าน">
            <i class="bi bi-clipboard app-icon" aria-hidden="true"></i>
            <span>คัดลอกลิงก์</span>
          </button>
        </div>
      </section>
      <section class="cashier-workspace" aria-labelledby="cashierQueueTitle">
        <header class="cashier-section-head">
          <div>
            <h2 id="cashierQueueTitle">บิลที่รอดำเนินการ</h2>
            <p>รายการใหม่จะแสดงที่หน้านี้โดยอัตโนมัติ</p>
          </div>
          <span id="cashierOrderCount" class="cashier-order-count">0 บิล</span>
        </header>
        <div id="orderGrid" class="cashier-order-grid"></div>
      </section>
    </main>
    <script
      type="module"
      src="/assets/js/page-guard.js?v=20260731-079"
    ></script>
    <script type="module" src="/assets/js/offline-data-service.js"></script>
    <script type="module" src="/assets/js/cashier.js?v=20260731-089"></script>
    <script type="module" src="/assets/js/cashier-takeaway-tools.js?v=20260731-089"></script>
    <script
      type="module"
      src="/assets/js/order-completion-finalizer.js?v=20260702-002"
    ></script>
    <script
      type="module"
      src="/assets/js/cashier-icon-hotfix.js?v=20260731-089"
    ></script>
    <script
      type="module"
      src="/assets/js/cashier-original-order.js?v=20260731-089"
    ></script>
  </body>
</html>
