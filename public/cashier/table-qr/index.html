<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#159447">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260801-096">
  <link rel="stylesheet" href="/assets/css/menu-qr.css?v=20260621-26">
  <link rel="stylesheet" href="/assets/css/cashier-qr-print.css?v=20260903-226">
  <link rel="stylesheet" href="/assets/css/icons.css?v=20260903-240">
  <link rel="stylesheet" href="/assets/css/sweet-dialog.css?v=20260731-095">
  <link rel="stylesheet" href="/assets/css/order-delivery-workspace-theme.css?v=20260731-079">
  <link rel="stylesheet" href="/assets/css/i18n.css?v=20260903-202">
  <title>ออก QR โต๊ะ</title>
</head>
<body class="order-delivery-workspace od-qr-page" data-roles="owner,admin,manager,cashier">
  <div id="demoBanner"></div>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">FO</span><span data-i18n="cashier_documents.table_qr.header_title">ออก QR โต๊ะ</span></div>
    <a class="btn btn-sm" href="/cashier"><span data-i18n="cashier_documents.table_qr.back">ย้อนกลับ</span></a>
    <div class="app-locale-switcher" data-static-locale-switcher><details class="app-locale-menu" data-locale-menu><summary class="app-locale-trigger" aria-label="Language" title="Language"><i class="bi bi-globe2" aria-hidden="true"></i><span class="visually-hidden">Language</span></summary><div class="app-locale-menu__panel" role="menu" aria-label="Language"><button type="button" class="app-locale-option" data-locale-option="th" lang="th" role="menuitemradio" aria-checked="true"><span>ไทย</span><i class="bi bi-check-lg" aria-hidden="true"></i></button><button type="button" class="app-locale-option" data-locale-option="en" lang="en" role="menuitemradio" aria-checked="false"><span>English</span><i class="bi bi-check-lg" aria-hidden="true"></i></button></div></details></div>
  </header>
  <main class="container">
    <section class="hero"><h1 data-i18n="cashier_documents.table_qr.hero_title">จัดการ QR โต๊ะ</h1><p data-i18n="cashier_documents.table_qr.hero_description">ออก QR ใหม่เฉพาะโต๊ะว่าง และพิมพ์ QR เดิมซ้ำได้</p></section>
    <section class="card" style="margin-bottom:18px"><div class="field"><label for="qrPaperSize" data-i18n="cashier_documents.table_qr.paper_size">ขนาดกระดาษสำหรับพิมพ์ QR</label><select class="input" id="qrPaperSize"><option value="80" data-i18n="cashier_documents.table_qr.paper_80">80 มม.</option><option value="58" data-i18n="cashier_documents.table_qr.paper_58">58 มม.</option><option value="a4">A4</option></select></div></section>
    <section><div class="section-title"><h2 data-i18n="cashier_documents.table_qr.available_title">โต๊ะว่าง</h2><span class="badge" id="availableCount">0 โต๊ะ</span></div><div id="availableTables" class="grid grid-3"></div></section>
    <section style="margin-top:22px"><div class="section-title"><h2 data-i18n="cashier_documents.table_qr.issued_title">โต๊ะที่ออก QR แล้ว</h2><span class="badge warning" id="occupiedCount">0 โต๊ะ</span></div><div id="occupiedTables" class="grid grid-3"></div></section>
    <section id="issuedQrWrap" hidden style="margin-top:18px"><div id="issuedQr"></div></section>
  </main>
  <script type="module" src="/assets/js/cashier-table-qr-i18n-bootstrap.js?v=20260903-226"></script>
  <script type="module" src="/assets/js/page-guard.js?v=20260904-001"></script>
  <script type="module" src="/assets/js/cashier-table-qr.js?v=20260903-226"></script>
  <script type="module" src="/assets/js/locale-switcher-static.js?v=20260903-202"></script>
  <script type="module" src="/assets/js/user-menu-i18n-static.js?v=20260903-202"></script>
</body>
</html>
