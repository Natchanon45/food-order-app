<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#159447" />
    <title>กำลังเปิดระบบคิวรอโต๊ะ</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f7f4;color:#173b28;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}.card{width:min(460px,100%);padding:28px;border:1px solid #d6e4da;border-radius:20px;background:#fff;box-shadow:0 18px 56px rgba(15,23,42,.12);text-align:center}.icon{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 14px;border-radius:17px;background:#e9f8ef;color:#075f33;font-size:25px}h1{margin:0;font-size:1.25rem}p{margin:8px 0 18px;color:#66776e;line-height:1.55}.spinner{width:28px;height:28px;margin:0 auto;border:3px solid #dbe7df;border-top-color:#159447;border-radius:999px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">W</div>
      <h1>กำลังเปิดระบบคิวรอโต๊ะ</h1>
      <p>รวมหน้ารับคิว เรียกคิว เลือกโต๊ะ และเปิดโต๊ะไว้ในหน้าจอเดียว</p>
      <div class="spinner" aria-hidden="true"></div>
    </main>
    <script>
      const target = new URL('/waiting-queue/', location.origin);
      for (const [key, value] of new URLSearchParams(location.search)) target.searchParams.set(key, value);
      target.hash = location.hash;
      location.replace(target.href);
    </script>
  </body>
</html>
