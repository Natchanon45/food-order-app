<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#159447">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260731-091">
  <link rel="stylesheet" href="/assets/css/icons.css?v=20260731-079">
  <link rel="stylesheet" href="/assets/css/order-delivery-workspace-theme.css?v=20260731-079">
  <link rel="stylesheet" href="/assets/css/admin-users.css?v=20260731-090">
  <title>จัดการพนักงาน</title>
</head>
<body class="order-delivery-workspace admin-users-page" data-roles="owner,super_admin">
  <header class="app-header">
    <div class="brand"><span class="brand-mark">FO</span>จัดการพนักงาน</div>
    <a class="btn btn-sm" href="/admin">กลับหน้าจัดการร้าน</a>
  </header>

  <main class="container">
    <section class="hero staff-hero">
      <div>
        <span class="staff-hero-kicker"><i class="bi bi-people" aria-hidden="true"></i> ทีมงานของร้าน</span>
        <h1>พนักงานของร้าน</h1>
        <p>เพิ่มพนักงาน กำหนดหน้าที่ และควบคุมการเข้าใช้งานเฉพาะร้านของคุณ</p>
      </div>
      <button class="btn staff-create-trigger" id="openCreateUserModal" type="button">
        <i class="bi bi-person-plus" aria-hidden="true"></i><span>เพิ่มพนักงาน</span>
      </button>
    </section>

    <section class="card staff-list-card">
      <div class="section-title staff-list-heading">
        <div>
          <h2>รายการพนักงาน</h2>
          <p>แก้ไขชื่อ สิทธิ์ และสถานะการใช้งานได้จากรายการด้านล่าง</p>
        </div>
        <span class="badge" id="userCount">0 คน</span>
      </div>
      <div class="user-table-scroll">
        <table class="table-list user-table">
          <thead><tr><th>ชื่อ</th><th>อีเมล</th><th>สิทธิ์</th><th>เปิดใช้งาน</th><th></th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog class="staff-dialog" id="userDialog" aria-labelledby="userDialogTitle">
    <form id="userForm" class="staff-dialog-form">
      <header class="staff-dialog-header">
        <span class="staff-dialog-icon"><i class="bi bi-person-plus" aria-hidden="true"></i></span>
        <div>
          <h2 id="userDialogTitle">เพิ่มพนักงานใหม่</h2>
          <p>สร้างบัญชีและกำหนดสิทธิ์เริ่มต้นให้พนักงาน</p>
        </div>
        <button class="staff-dialog-close" id="closeCreateUserModal" type="button" aria-label="ปิด">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </header>
      <div class="staff-dialog-body">
        <div class="grid grid-2">
          <div class="field"><label for="displayName">ชื่อที่แสดง</label><input class="input" id="displayName" required maxlength="100" placeholder="เช่น พนักงานแคชเชียร์"></div>
          <div class="field"><label for="email">อีเมล</label><input class="input" id="email" type="email" autocomplete="off" required placeholder="name@example.com"></div>
        </div>
        <div class="grid grid-2">
          <div class="field"><label for="password">รหัสผ่านเริ่มต้น</label><input class="input" id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="อย่างน้อย 8 ตัวอักษร"></div>
          <div class="field"><label for="confirmPassword">ยืนยันรหัสผ่าน</label><input class="input" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="กรอกรหัสผ่านอีกครั้ง"></div>
        </div>
        <div class="field"><label for="role">สิทธิ์พนักงาน</label><select class="input" id="role" required><option value="admin">Admin — จัดการร้าน</option><option value="cashier">Cashier — รับชำระเงิน</option><option value="kitchen">Kitchen — จัดการครัว</option></select></div>
        <label class="staff-active-option">
          <span><strong>เปิดใช้งานทันที</strong><small>พนักงานสามารถเข้าสู่ระบบได้หลังสร้างบัญชี</small></span>
          <input type="checkbox" id="active" checked>
        </label>
        <div class="upload-error" id="userError" hidden></div>
      </div>
      <footer class="staff-dialog-footer">
        <button class="btn staff-cancel-button" id="cancelCreateUserModal" type="button"><i class="bi bi-x-circle" aria-hidden="true"></i><span>ยกเลิก</span></button>
        <button class="btn btn-primary user-form-action" id="createUserButton" type="submit"><i class="bi bi-person-plus" aria-hidden="true"></i><span>สร้างผู้ใช้งาน</span></button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/assets/js/page-guard.js?v=20260731-079"></script>
  <script type="module" src="/assets/js/admin-users.js?v=20260731-090"></script>
</body>
</html>
