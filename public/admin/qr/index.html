<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#159447">
  <link rel="stylesheet" href="/assets/css/app.css?v=20260801-096">
  <link rel="stylesheet" href="/assets/css/menu-qr.css?v=20260903-204">
  <link rel="stylesheet" href="/assets/css/icons.css?v=20260903-240">
  <link rel="stylesheet" href="/assets/css/admin-icon-polish.css?v=20260704-002">
  <link rel="stylesheet" href="/assets/css/order-delivery-workspace-theme.css?v=20260731-079">
  <link rel="stylesheet" href="/assets/css/i18n.css?v=20260903-202">
  <title>QR โต๊ะ</title>
</head>
<body class="order-delivery-workspace od-qr-page" data-roles="admin,owner">
  <div id="demoBanner"></div>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">FO</span><span data-i18n="admin_qr.header.title">QR โต๊ะ</span></div>
    <a class="btn btn-sm" href="/admin"><span data-i18n="admin_qr.header.back">ย้อนกลับ</span></a>
    <div class="app-locale-switcher" data-static-locale-switcher>
      <details class="app-locale-menu" data-locale-menu>
        <summary class="app-locale-trigger" aria-label="เลือกภาษา" title="Language"><i class="bi bi-globe2" aria-hidden="true"></i><span class="visually-hidden">Language</span></summary>
        <div class="app-locale-menu__panel" role="menu" aria-label="Language">
          <button type="button" class="app-locale-option" data-locale-option="th" lang="th" role="menuitemradio" aria-checked="true"><span>ไทย</span><i class="bi bi-check-lg" aria-hidden="true"></i></button>
          <button type="button" class="app-locale-option" data-locale-option="en" lang="en" role="menuitemradio" aria-checked="false"><span>English</span><i class="bi bi-check-lg" aria-hidden="true"></i></button>
        </div>
      </details>
    </div>
  </header>
  <main class="container">
    <section class="hero">
      <h1 data-i18n="admin_qr.hero.title">สร้าง QR แยกตามโต๊ะ</h1>
      <p data-i18n="admin_qr.hero.description">พิมพ์และติดไว้ที่โต๊ะ ลูกค้าสแกนแล้วระบบรู้รหัสโต๊ะทันที</p>
    </section>
    <div class="field card" style="margin-bottom:16px">
      <label data-i18n="admin_qr.base_url">โดเมนร้านตาม slug</label>
      <input class="input" id="baseUrl" readonly>
    </div>
    <div id="qrGrid" class="qr-grid"></div>
  </main>
  <script type="module" src="/assets/js/page-guard.js?v=20260904-001"></script>
  <script type="module" src="/assets/js/qr.js?v=20260903-204"></script>
  <script type="module" src="/assets/js/locale-switcher-static.js?v=20260903-202"></script>
  <script type="module" src="/assets/js/user-menu-i18n-static.js?v=20260903-202"></script>
  <script type="module" src="/assets/js/admin-icon-polish.js?v=20260903-203"></script>
</body>
</html>
