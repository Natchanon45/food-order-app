name: Hybrid Billing Minimal Delivery-only (no deploy)

on:
  push:
    branches: [feature/hybrid-billing-delivery-only-minimal]
  pull_request:
    branches: [feature/react-firebase-port]

permissions:
  contents: read

jobs:
  pure-billing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check functions/hybrid-billing-orders.js
          node --check functions/hybrid-billing-delivery-only.js
          node --check functions/hybrid-billing-preview.js
          node -e 'JSON.parse(require("node:fs").readFileSync("firestore.indexes.json", "utf8"))'
      - name: Hybrid monthly policy and Delivery-only regression
        run: node --test tests/react-parity/hybrid-billing.spec.mjs tests/react-parity/hybrid-billing-delivery-only.spec.mjs
      - name: Install only existing Functions dependencies for report compatibility tests
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Existing billing/order/report/signup regression contracts
        run: node --test tests/react-parity/hybrid-billing-orders.spec.mjs tests/react-parity/hybrid-billing-report.spec.mjs tests/react-parity/signup-billing-revenue-share.spec.mjs

      - name: Hybrid invoice, payment and access lifecycle contract tests
        run: |
          node --check functions/hybrid-billing-ledger.js
          node --test tests/react-parity/hybrid-billing-ledger.spec.mjs
      - name: Delivery paidAt completeness and anniversary preview guards
        run: node --test tests/react-parity/hybrid-billing-audit.spec.mjs
      - name: Verify React source compiles (no deploy)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:react
