name: Hybrid Trusted Journal Scale (demo emulator only)

on:
  push:
    branches:
      - feature/hybrid-billing-github-first
    paths:
      - tests/react-parity/hybrid-billing-trusted-journal-benchmark.spec.mjs
      - tools/run-hybrid-billing-emulator.mjs
      - .github/workflows/hybrid-billing-trusted-journal-scale.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hybrid-trusted-journal-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-trusted-10000:
    name: 10000 genuine journaled COD writer transactions (not production)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install isolated Emulator dependencies (NO DEPLOY)
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix functions --no-audit --no-fund
          npm install --global firebase-tools@15.34.0 --no-audit --no-fund
      - name: Run 10000 real demo COD journal writer transactions, 8 concurrency
        timeout-minutes: 48
        env:
          HYBRID_EMULATOR_TEST_TARGET: journal-scale
          HYBRID_JOURNAL_BENCHMARK_COUNT: "10000"
          HYBRID_JOURNAL_BENCHMARK_WORKERS: "8"
        run: npm run test:hybrid-billing:emulator
      - name: No tracked generated assets or source mutation
        run: git diff --exit-code
